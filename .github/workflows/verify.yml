name: Verify detector capacity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.5'
      - name: Install pinned dependency
        run: python -m pip install -r verification/requirements.txt
      - name: Original finite checks and rational energy certificate
        run: python verification/verify.py
      - name: Learning structure and channel regressions
        run: |
          python verification/check_learning.py
          python -m unittest discover -s verification -p 'test_*.py' -v
      - name: Rational two-photon certificate
        run: python verification/qutrit_certificate.py
      - name: Check source remains unchanged
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
